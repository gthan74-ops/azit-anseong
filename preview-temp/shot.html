<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;padding:0;background:#faf9f6;overflow:hidden}iframe{border:0;display:block}iframe::-webkit-scrollbar{display:none}</style></head>
<body><iframe id="f" scrolling="no"></iframe>
<script>
  var q=new URLSearchParams(location.search);
  var w=parseInt(q.get('w')||'1440',10), h=parseInt(q.get('h')||'900',10);
  var f=document.getElementById('f');
  f.style.width=w+'px'; f.style.height=h+'px';
  f.addEventListener('load',function(){
    setTimeout(function(){
      try{
        f.contentDocument.querySelectorAll('img[loading="lazy"]').forEach(function(i){i.loading='eager';});
        f.contentDocument.documentElement.style.scrollBehavior='auto';
      }catch(e){}
      var sel=q.get('sel'), y=parseInt(q.get('y')||'0',10);
      setTimeout(function(){
        try{
          var win=f.contentWindow;
          if(sel){ var el=f.contentDocument.querySelector(sel); if(el){ y = el.getBoundingClientRect().top + (win.scrollY||0) - 84; } }
          win.scrollTo(0, Math.max(0,y));
          if(q.get('up')){ setTimeout(function(){ win.scrollTo(0, Math.max(0,y-40)); }, 200); }
        }catch(e){}
      }, 400);
    },300);
  });
  f.src='../index.html?v='+Date.now();
</script></body></html>
