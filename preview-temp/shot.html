<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;padding:0;background:#faf9f6}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
  var q=new URLSearchParams(location.search);
  var w=parseInt(q.get('w')||'1440',10), h=parseInt(q.get('h')||'900',10);
  var f=document.getElementById('f');
  f.style.width=w+'px'; f.style.height=h+'px';
  f.addEventListener('load',function(){ setTimeout(function(){ try{ f.contentDocument.querySelectorAll('img[loading="lazy"]').forEach(function(i){i.loading='eager';}); }catch(e){} },300); });
  f.src='/azit-anseong/?v='+Date.now();
</script></body></html>
