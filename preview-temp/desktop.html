<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#faf9f6}iframe{border:0;display:block;width:1440px;height:900px}</style></head>
<body><iframe id="f" src="/azit-anseong/?v=p2" scrolling="no"></iframe>
<script>
  var y = parseInt(new URLSearchParams(location.search).get('y')||'0',10);
  document.getElementById('f').addEventListener('load', function(){
    var w=this.contentWindow, d=this.contentDocument;
    d.querySelectorAll('img[loading="lazy"]').forEach(function(i){i.loading='eager';});
    w.scrollTo(0,y);
  });
</script></body></html>
