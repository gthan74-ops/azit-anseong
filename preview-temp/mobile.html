<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#faf9f6}iframe{border:0;display:block;width:390px;height:844px}</style></head>
<body><iframe id="f" src="/azit-anseong/?v=p2"></iframe>
<script>
  var y = parseInt(new URLSearchParams(location.search).get('y')||'0',10);
  document.getElementById('f').addEventListener('load', function(){
    var w=this.contentWindow, d=this.contentDocument;
    d.querySelectorAll('img[loading="lazy"]').forEach(function(i){i.loading='eager';});
    var go=function(){w.scrollTo(0,y);};
    go(); setTimeout(go,350); setTimeout(go,900);
  });
</script></body></html>
