<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>preview</title>
<style>
  html,body{margin:0;padding:0;background:#d8d5cd;font:11px/1.4 -apple-system,system-ui,sans-serif;color:#333}
  .wrap{display:flex;gap:20px;align-items:flex-start;padding:14px}
  .col{background:#fff}
  .cap{padding:6px 8px;letter-spacing:.1em;text-transform:uppercase;background:#333;color:#fff}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="col"><div class="cap">desktop 1440</div><iframe id="d" src="/azit-anseong/?v=p1" width="1440" height="900" scrolling="no"></iframe></div>
  <div class="col"><div class="cap">mobile 390</div><iframe id="m" src="/azit-anseong/?v=p1" width="390" height="844" scrolling="no"></iframe></div>
</div>
<script>
  function fit(){
    document.querySelectorAll('iframe').forEach(function(f){
      try{
        var d=f.contentDocument, w=f.contentWindow;
        d.querySelectorAll('img[loading="lazy"]').forEach(function(i){i.loading='eager';});
        var h=d.documentElement.scrollHeight;
        f.style.height=h+'px';
        w.scrollTo(0,0);
      }catch(e){}
    });
  }
  window.addEventListener('load',fit);
  setInterval(fit,700);
</script>
</body>
</html>
